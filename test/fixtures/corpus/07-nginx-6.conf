user www-data;
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    sendfile on;
    server_tokens off;
    proxy_set_header Host $host;
    upstream backend {
        server 10.0.0.10:8080;
        server 10.0.0.11:8080;
        keepalive 16;
    }
    server {
        listen 10.0.0.1:8443 ssl;
        server_name api.example.test www.admin.example.test;
        root /var/www/html;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        ssl_protocols TLSv1.2 TLSv1.3;
    }
    server {
        listen 443 ssl;
        server_name docs.example.test;
        root /var/www/shop;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        include snippets/ssl-params.conf;
        location /assets/ {
            location /api/ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php-fpm.sock;
            }
        }
        location /ws/ {
            proxy_pass http://unix:/run/app.sock:/;
        }
    }
    server {
        listen 80 default_server;
        server_name shop.example.test;
        root /var/www/shop;
        location /admin/ {
            location ~* \.(css|js)$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php-fpm.sock;
            }
        }
        location ^~ /images/ {
            try_files $uri $uri/ =404;
        }
        location ~* \.(css|js)$ {
            location ^~ /images/ {
                deny all;
                return 403;
            }
        }
    }
    include /etc/nginx/conf.d/*.conf;
}
