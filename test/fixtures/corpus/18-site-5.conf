server {
    listen 80;
    server_name static.example.test www.docs.example.test;
    server_tokens on;
    location = /health {
        deny all;
        return 403;
    }
    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:3000;
    }
    location ~* \.(css|js)$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}

server {
    listen 127.0.0.1:8080;
    server_name shop.example.test;
    location / {
        try_files $uri $uri/ =404;
    }
    location ~* \.(css|js)$ {
        location /admin/ {
            try_files $uri $uri/ =404;
        }
    }
    location /api/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
