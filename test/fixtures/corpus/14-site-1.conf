server {
    listen *:80;
    server_name api.example.test www.api.example.test;
    add_header X-Frame-Options DENY;
    location = /health {
        include proxy_params;
        proxy_set_header Host $host;
        proxy_pass https://upstream_tls;
    }
    location ^~ /images/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
    location ~* \.(css|js)$ {
        deny all;
        return 403;
    }
}

server {
    listen [::]:80;
    server_name api.example.test www.static.example.test;
    root /var/www/shop;
    location /api/ {
        try_files $uri $uri/ =404;
    }
    location /ws/ {
        deny all;
        return 403;
    }
    location /admin/ {
        try_files $uri $uri/ =404;
    }
}
