user www-data;
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    sendfile on;
    server_tokens off;
    upstream backend {
        server 10.0.0.10:8080;
        server 10.0.0.11:8080;
        server 10.0.0.12:8080 backup;
        keepalive 16;
    }
    server {
        listen [::]:443 ssl;
        server_name docs.example.test;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        include snippets/ssl-params.conf;
        location = /health {
            location /admin/ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php-fpm.sock;
            }
        }
        location ^~ /images/ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }
    server {
        listen [::]:443 ssl;
        server_name admin.example.test;
        root /var/www/shop;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include snippets/ssl-params.conf;
    }
    server {
        listen 443 ssl http2;
        server_name api.example.test;
        root /var/www/docs;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
    }
    server {
        listen 10.0.0.1:8443 ssl;
        server_name static.example.test;
        root /var/www/html;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        include snippets/ssl-params.conf;
        location /api/ {
            location = /health {
                try_files $uri $uri/ =404;
            }
        }
        location = /health {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
        location /api/ {
            try_files $uri $uri/ =404;
        }
    }
}
