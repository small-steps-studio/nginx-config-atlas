user www-data;
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    sendfile on;
    upstream backend {
        server 10.0.0.10:8080;
        server 10.0.0.11:8080;
        server 10.0.0.12:8080 backup;
        keepalive 16;
    }
    server {
        listen 443 ssl;
        server_name static.example.test;
        root /var/www/shop;
        server_tokens build;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
    }
    server {
        listen 127.0.0.1:8080;
        server_name shop.example.test;
        root /var/www/shop;
    }
    server {
        listen 10.0.0.1:8443 ssl;
        server_name shop.example.test;
        root /var/www/shop;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location /api/ {
            try_files $uri $uri/ =404;
        }
    }
    server {
        listen 10.0.0.1:8443 ssl;
        server_name docs.example.test;
        root /var/www/html;
        server_tokens build;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        ssl_protocols SSLv3 TLSv1.2;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
