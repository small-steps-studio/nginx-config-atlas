user www-data;
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    sendfile on;
    server_tokens on;
    upstream backend {
        server 10.0.0.10:8080 weight=2;
        keepalive 16;
    }
    server {
        listen *:80;
        server_name api.example.test;
        root /var/www/shop;
        server_tokens on;
        add_header X-Frame-Options DENY;
    }
    server {
        listen 80;
        server_name docs.example.test www.static.example.test;
        server_tokens off;
    }
    server {
        listen 80;
        server_name admin.example.test;
        root /var/www/shop;
        location ^~ /images/ {
            deny all;
            return 403;
        }
    }
    include /etc/nginx/conf.d/*.conf;
}
