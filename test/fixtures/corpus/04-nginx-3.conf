user www-data;
worker_processes auto;
events {
    worker_connections 1024;
}
http {
    include mime.types;
    sendfile on;
    proxy_set_header Host $host;
    upstream backend {
        server 10.0.0.10:8080;
        server 10.0.0.11:8080;
        server 10.0.0.12:8080 backup;
        keepalive 16;
    }
    server {
        listen 443 ssl;
        server_name admin.example.test;
        ssl_certificate /etc/ssl/certs/site.pem;
        ssl_certificate_key /etc/ssl/private/site.key;
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
        location /assets/ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
        location ~* \.(css|js)$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
    }
    server {
        listen [::]:80;
        server_name docs.example.test;
        location /ws/ {
            location = /health {
                include proxy_params;
                proxy_set_header Host $host;
                proxy_pass http://backend;
            }
        }
    }
    server {
        listen [::]:80;
        server_name docs.example.test www.docs.example.test;
        location ~* \.(css|js)$ {
            try_files $uri $uri/ =404;
            autoindex on;
        }
        location /api/ {
            proxy_set_header Host $host;
            proxy_pass http://unix:/run/app.sock:/;
        }
    }
    server {
        listen 80 default_server;
        server_name static.example.test;
        server_tokens on;
        location /admin/ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php-fpm.sock;
        }
        location ~* \.(css|js)$ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://unix:/run/app.sock:/;
        }
    }
}
