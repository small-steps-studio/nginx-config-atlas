upstream backend {
    server 10.0.0.10:8080;
    keepalive 16;
}

server {
    listen 127.0.0.1:8080;
    server_name docs.example.test;
    add_header X-Frame-Options DENY;
    location / {
        location ^~ /images/ {
            deny all;
            return 403;
        }
    }
    location = /health {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
    }
}
